<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PASES · Tela do aluno</title>
  <link rel="icon" href="assets/simbolo-ifma.png">
  <script src="config.js"></script>
  <style>
    :root { --verde: #2f9e41; --vermelho: #d0262c; --ambar: #e0a33a; --fundo: #0c120f; --cartao: #151d19; --linha: #26312b; --tinta: #f1f5f3; --tinta-2: #a9b8b0; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--tinta); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }
    .topo { display: flex; align-items: center; gap: 18px; padding: 16px 28px; border-bottom: 1px solid var(--linha); }
    .topo img { height: 52px; }
    .topo h1 { margin: 0; font-size: 26px; font-weight: 700; }
    .topo small { display: block; color: var(--tinta-2); font-size: 16px; font-weight: 500; }
    .topo .espaco { flex: 1; }
    .hora { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .faixa { padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 17px; background: #24302a; }
    .faixa.ok { background: #1d4d2a; color: #b7f0c5; }
    .faixa.fora { background: #5a3d0a; color: #ffd98f; }
    main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; padding: 24px 28px; height: calc(100vh - 86px); }
    .camera { position: relative; background: #000; border-radius: 22px; overflow: hidden; }
    .camera video, .camera canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .espelho { transform: scaleX(-1); }
    .camera .dica { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: rgba(0,0,0,.65); padding: 10px 22px; border-radius: 99px; font-size: 22px; font-weight: 600; white-space: nowrap; }
    .camera .semcam { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 26px; color: #ffb4b7; padding: 30px; }
    .painel { overflow: hidden; background: var(--cartao); border: 1px solid var(--linha); border-radius: 22px; padding: 24px 28px; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center; }
    .painel h2 { margin: 0; font-size: 36px; line-height: 1.15; }
    .painel p { margin: 0; font-size: 24px; color: var(--tinta-2); }
    .painel .grande { font-size: 30px; color: var(--tinta); font-weight: 600; }
    .cpf { font-family: ui-monospace, Consolas, monospace; font-size: 52px; letter-spacing: 4px; background: #0b100d; border: 1px solid var(--linha); border-radius: 16px; padding: 18px; }
    .fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .fotos.uma { grid-template-columns: 28vh; justify-content: center; }
    .fotos.uma .foto { height: 36vh; }
    .foto { position: relative; height: 30vh; width: 100%; background: #0b100d; border-radius: 16px; overflow: hidden; display: grid; place-items: center; color: var(--tinta-2); font-size: 18px; border: 3px solid transparent; }
    .foto img { width: 100%; height: 100%; object-fit: cover; }
    .foto span { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.65); padding: 4px 12px; border-radius: 99px; font-size: 15px; color: #fff; }
    .foto.sem { color: #ffb4b7; font-weight: 700; }
    .icone { width: 84px; height: 84px; flex: none; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
    .icone svg { width: 50px; height: 50px; }
    .ok .icone { background: var(--verde); } .erro .icone { background: var(--vermelho); } .aviso .icone { background: var(--ambar); }
    .ok .foto { border-color: var(--verde); }
    .nome { font-size: 32px; font-weight: 800; line-height: 1.15; }
    .sub { font-size: 22px; color: var(--tinta-2); }
    .tecla { display: inline-block; border: 2px solid currentColor; border-radius: 10px; padding: 2px 14px; font-weight: 800; }
    .girando { width: 70px; height: 70px; border: 7px solid #2a3831; border-top-color: var(--verde); border-radius: 50%; margin: 0 auto; animation: g 0.9s linear infinite; }
    @keyframes g { to { transform: rotate(360deg); } }
    .barra-ctrl { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 8px; opacity: 0; transition: opacity .2s; }
    body:hover .barra-ctrl { opacity: 1; }
    .barra-ctrl button { background: #25302b; color: #fff; border: 1px solid #36443d; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } .camera { height: 50vh; } .painel h2 { font-size: 30px; } }
  </style>
</head>
<body>
  <div class="topo">
    <img src="assets/logo-ifma.png" alt="IFMA" style="background:#fff;border-radius:10px;padding:4px">
    <div><h1>PASES · Refeição</h1><small>Programa de Alimentação Estudantil</small></div>
    <span class="espaco"></span>
    <span class="faixa" id="faixa"></span>
    <span class="hora" id="hora">--:--</span>
  </div>
  <main>
    <div class="camera" id="camera">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="over"></canvas>
      <div class="dica" id="dica">Olhe para a câmera</div>
      <div class="semcam" id="semcam" hidden>Câmera indisponível.<br>Digite seu CPF no teclado.</div>
    </div>
    <section class="painel" id="painel"></section>
  </main>
  <div class="barra-ctrl"><button id="cheia">Tela cheia</button></div>
  <script type="module" src="js/tela-aluno.js"></script>
</body>
</html>
